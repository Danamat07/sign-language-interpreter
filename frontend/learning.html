<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASL Learning Module</title>
    <link rel="stylesheet" href="css/learning.css">
</head>
<body>

<div class="learning-wrapper">

    <!-- LEFT -->
    <div class="learning-container">

        <h1>Learning Module</h1>

        <p id="progress-text">Loading progress...</p>

        <div id="letters-grid"></div>

        <!-- BACK BUTTON CENTRAT SUB GRID -->
        <button id="back-btn">Back to Profile</button>

    </div>

    <!-- RIGHT -->
    <div class="dynamic-container">

        <h2>Dynamic Letters</h2>

        <div class="dynamic-letters">
            <div class="dynamic-card" data-letter="J">J</div>
            <div class="dynamic-card" data-letter="Z">Z</div>
        </div>

    </div>

</div>

<script type="module" src="js/learning.js"></script>

</body>
</html>
